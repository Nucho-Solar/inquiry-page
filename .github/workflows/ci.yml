name: CI

on:
  pull_request:
  push:
    branches: [main]

# No lint step yet: `npm run lint` has 3 pre-existing errors that are fixed in a separate PR.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
