version: '3.8'

services:
  nucho-solar:
    build: .
    container_name: nucho-solar-app
    ports:
      - "3000:80"
    environment:
      - VITE_APP_NAME=Nucho Solar
      - VITE_WHATSAPP_PHONE=254758330507
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
